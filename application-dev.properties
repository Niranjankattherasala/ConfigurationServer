# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/money
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.currencyService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.currencyService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.currencyService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.currencyService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.currencyService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.currencyService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.currencyService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Actuator Configuration
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.startup.enabled=true

# Application Info
info.app.name=CurrencyConversionProject
info.app.description=Converts currency using live rates from the Currency Exchange Service
info.app.version=1.0.0
info.app.author=Niranjan Kattherasala

# Spring Boot Admin Client Configuration
spring.boot.admin.client.url=http://localhost:9095
spring.boot.admin.client.instance.service-base-url=http://localhost:${server.port}

#zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


